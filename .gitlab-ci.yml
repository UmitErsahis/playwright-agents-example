# GitLab CI/CD Pipeline for Playwright Tests

stages:
  - test

# Test with normal Playwright (recommended - fast)
playwright-test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.58.2-jammy
  before_script:
    - npm ci
  script:
    - npx playwright test
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 30 days
  only:
    - main
    - master
    - merge_requests

# Test with Docker (optional - 100% same as local)
playwright-test-docker:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker info
  script:
    - docker build -t playwright-agents-example .
    - docker run --rm 
        -v $CI_PROJECT_DIR/test-results:/app/test-results 
        -v $CI_PROJECT_DIR/playwright-report:/app/playwright-report 
        playwright-agents-example
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 30 days
  only:
    - main
    - master
    - merge_requests
